name: Refresh staging Home feed

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified candidate to staging (otherwise collect only)
        type: boolean
        default: false
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: staging-home-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Disabled until secrets, live validation, and default-branch deployment are approved.
    if: vars.HOME_FEED_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: home-feed-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated feed dependencies
        working-directory: home-feed
        run: npm ci --ignore-scripts
      - name: Test without credentials
        working-directory: home-feed
        run: |
          npm test
          node --experimental-strip-types --test gateway/test/*.test.mjs
      - name: Refresh
        env:
          HOME_GAME_AUTH_JSON: ${{ secrets.HOME_GAME_AUTH_JSON }}
          HOME_GATEWAY_URL: ${{ vars.HOME_GATEWAY_URL }}
          HOME_GATEWAY_TOKEN: ${{ secrets.HOME_GATEWAY_TOKEN }}
          HOME_FEED_ENABLE_PUBLICATION: ${{ vars.HOME_FEED_ENABLE_PUBLICATION }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'schedule' || inputs.publish }}
        shell: bash
        run: |
          if [ "$PUBLISH_REQUESTED" = "true" ]; then
            node home-feed/run-refresh.mjs --publish-staging "$RUNNER_TEMP/home-feed-candidate"
          else
            node home-feed/run-refresh.mjs --collect-only "$RUNNER_TEMP/home-feed-candidate"
          fi
      # No HAR, credentials, raw responses, or image archives uploaded as artifacts.
